name: Recover Bolt snapshot to isolated branch

on:
  push:
    branches:
      - recovery/bolt-snapshot-2026-10-17
    paths:
      - .github/workflows/recover-bolt-snapshot.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the isolated recovery branch
        uses: actions/checkout@v6
        with:
          ref: recovery/bolt-snapshot-2026-10-17
          fetch-depth: 0

      - name: Download both public Bolt snapshots and verify exact hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bolt-snapshots
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/Report-Engainall/report-insight-engine/main/incoming-archives/nasr1-bolt-recovery-2026-10-17/Nasr1_Bolt_Restored_Current.zip" --output /tmp/bolt-snapshots/restored-current.zip
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/Report-Engainall/report-insight-engine/main/incoming-archives/nasr1-bolt-recovery-2026-10-17/Nasr1_Bolt_Before_Failure.zip" --output /tmp/bolt-snapshots/before-failure.zip
          echo "9e012da1795cb9549413f78366c3bd6885c593e5a56e2fea10d4cf3fe810b214  /tmp/bolt-snapshots/restored-current.zip" | sha256sum --check
          echo "d59b3084a0b51e26646cf08ffc9239d2ee440298e9799f079827a4939d31b365  /tmp/bolt-snapshots/before-failure.zip" | sha256sum --check

      - name: Restore app source, recover premium UI variants, quarantine SQL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import hashlib, json

          root=Path.cwd()
          archives={
            "restored_current":Path("/tmp/bolt-snapshots/restored-current.zip"),
            "before_failure":Path("/tmp/bolt-snapshots/before-failure.zip"),
          }
          expected={
            "restored_current":"9e012da1795cb9549413f78366c3bd6885c593e5a56e2fea10d4cf3fe810b214",
            "before_failure":"d59b3084a0b51e26646cf08ffc9239d2ee440298e9799f079827a4939d31b365",
          }
          def sha(data): return hashlib.sha256(data).hexdigest()
          def read_zip(path):
            result={}
            with ZipFile(path) as z:
              bad=z.testzip()
              if bad: raise RuntimeError(f"ZIP CRC failure: {path.name}: {bad}")
              entries=[i for i in z.infolist() if not i.is_dir()]
              names=[i.filename.replace("\\\\","/").lstrip("/") for i in entries]
              roots={n.split("/",1)[0] for n in names if "/" in n}
              strip=next(iter(roots)) if len(roots)==1 and all("/" in n for n in names) else None
              for info,name in zip(entries,names):
                rel=name[len(strip)+1:] if strip and name.startswith(strip+"/") else name
                p=PurePosixPath(rel)
                if p.is_absolute() or ".." in p.parts: raise RuntimeError(f"Unsafe member path: {rel}")
                result[rel]=z.read(info)
            return result
          snapshots={}
          for label,path in archives.items():
            actual=sha(path.read_bytes())
            if actual!=expected[label]: raise RuntimeError(f"SHA-256 mismatch for {label}: {actual}")
            snapshots[label]=read_zip(path)
          current=snapshots["restored_current"]
          before=snapshots["before_failure"]

          copied=[]
          env_metadata=[]
          for label,files in snapshots.items():
            if ".env" in files:
              env_metadata.append({"snapshot":label,"path":".env","bytes":len(files[".env"]),"sha256":sha(files[".env"]),"contents_copied":False})
          for name,data in current.items():
            if name==".env" or name.startswith(".env."):
              continue
            if name=="tsconfig.tsbuildinfo" or name.startswith(".github/workflows/"):
              continue
            if name.startswith("supabase/migrations/"):
              continue
            dest=root.joinpath(*PurePosixPath(name).parts)
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(data)
            copied.append(name)

          # Recover presentation code from the before-failure snapshot where the
          # logic is compatible with the newer schema-oriented current snapshot.
          ui_paths=[
            "src/components/store/BannerSlider.tsx",
            "src/components/store/ProductCard.tsx",
            "src/components/store/StoreFooter.tsx",
            "src/components/store/StoreHeader.tsx",
            "src/pages/store/HomePage.tsx",
            "src/pages/admin/AdminLayout.tsx",
            "src/styles.css",
            "src/styles/premium-ui.css",
            "package.json",
            "package-lock.json",
          ]
          restored_ui=[]
          for name in ui_paths:
            data=before.get(name)
            if data is None: raise RuntimeError(f"Missing presentation recovery file: {name}")
            dest=root.joinpath(*PurePosixPath(name).parts)
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(data)
            restored_ui.append({"path":name,"bytes":len(data),"sha256":sha(data)})

          migrations=[
            "supabase/migrations/20261017003140_grant_admin_role_777530851.sql.sql",
            "supabase/migrations/20261017003200_set_admin_password_777530851.sql.sql",
            "supabase/migrations/20261017003522_executive_analytics_and_customer_360.sql.sql",
            "supabase/migrations/20261017012307_20261017040000_fix_missing_rpcs_and_analytics.sql",
          ]
          quarantine=root/"docs/recovery-quarantine/supabase-migrations"
          quarantine.mkdir(parents=True,exist_ok=True)
          migration_meta=[]
          for name in migrations:
            source="before_failure" if name in before and name not in current else "restored_current"
            data=snapshots[source].get(name)
            if data is None:
              other="restored_current" if source=="before_failure" else "before_failure"
              source=other
              data=snapshots[source].get(name)
            if data is None:
              migration_meta.append({"path":name,"status":"not found"})
              continue
            row={"path":name,"source_snapshot":source,"bytes":len(data),"sha256":sha(data),"status":"quarantined_not_applied"}
            if "grant_admin_role" in name or "set_admin_password" in name:
              row["content"]="not copied pending explicit security review"
            else:
              dest=quarantine/(Path(name).name+".txt")
              header=("RECOVERY QUARANTINE — DO NOT APPLY AUTOMATICALLY\n"
                      f"Original path: {name}\nSource: {source}\nSHA-256: {sha(data)}\n"
                      "Review against the current schema, RLS and function grants in an isolated database before any use.\n\n").encode("utf-8")
              dest.write_bytes(header+data)
              row["quarantine_path"]=dest.relative_to(root).as_posix()
            migration_meta.append(row)

          (root/"docs/recovery-quarantine/README_AR.md").write_text(
            "# ملفات SQL المسترجعة — منطقة حجر\n\n"
            "الملفات في هذا المسار أدلة مراجعة فقط، وليست migrations فعالة. لا تنقلها إلى supabase/migrations ولا تطبقها قبل مراجعة المخطط الحقيقي وسياسات RLS ومنح الصلاحيات والدوال، والاختبار في قاعدة معزولة. "
            "ملفا role/password محفوظان في سجل الجرد بالبصمة والحجم فقط ولم ينسخ محتواهما إلى هذا الفرع لحين المراجعة الأمنية.\n",encoding="utf-8")
          manifest={
            "target_branch":"recovery/bolt-snapshot-2026-10-17",
            "source_archive_sha256":expected,
            "source_file_counts":{"restored_current":len(current),"before_failure":len(before)},
            "restored_current_files_copied":len(copied),
            "pre_failure_ui_files_restored":restored_ui,
            "environment_files_excluded":env_metadata,
            "database_migrations":migration_meta,
            "safety":["main not changed","no .env copied","no generated tsbuildinfo copied","no supabase/migrations file overwritten or activated","no SQL executed"],
          }
          (root/"docs/recovery").mkdir(parents=True,exist_ok=True)
          (root/"docs/recovery/RECOVERY_FROM_BOLT_SNAPSHOTS_2026-10-17.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          (root/"docs/recovery/RECOVERY_FROM_BOLT_SNAPSHOTS_2026-10-17.md").write_text(
            "# استعادة آمنة لنسختي Bolt — 17 أكتوبر 2026\n\n"
            "تم بناء هذا الفرع من main دون تعديل main. استُخدم كود النسخة المستعادة كقاعدة، ثم أعيدت مكونات واجهة مختارة من نسخة ما قبل الخلل لأنها أغنى بصريًا ومتوافقة على مستوى العرض؛ لم تُستعد ملفات نموذج البيانات أو المصادقة أو الأسعار أو الطلبات القديمة بشكل أعمى.\n\n"
            "## الحماية\n"
            "- استُبعدت ملفات البيئة .env.\n- لم يجر تشغيل أو تطبيق أي migration.\n- بقيت ملفات SQL الإضافية في منطقة حجر خارج المسار النشط، وملفا role/password محفوظان كبصمات وبيانات وصفية فقط.\n"
            "- لم تُنسخ ملفات TypeScript المولدة.\n\n## نسخ واجهة ما قبل الخلل\n"
            + "".join(f"- {x['path']} — {x['bytes']} bytes; SHA-256 {x['sha256']}\n" for x in restored_ui)
            + "\n## جرد موجز\n"
            + f"- ملفات المصدر في نسخة Bolt المستعادة: {len(current)}\n- ملفات المصدر في نسخة ما قبل الخلل: {len(before)}\n- ملفات النسخة الحالية التي نُقلت بعد الاستبعادات: {len(copied)}\n"
            + "- الشاشات الإضافية تشمل إدارة المخزون والموردين والتسعير والتقارير والإشعارات وسجل التدقيق وعميل 360 ومساعد المتجر والمفضلة والمقارنة؛ ما زال يلزم اختبار الربط الفعلي والـ build.\n\n"
            + "## ملفات SQL المعزولة\n"
            + "".join(f"- {m['path']} — {m.get('bytes','?')} bytes; SHA-256 {m.get('sha256','غير متاح')}; {m['status']}\n" for m in migration_meta)
            + "\nهذا الفرع للإصلاح والمراجعة فقط؛ لا يمثل شهادة أن التطبيق قابل للنشر.\n",
            encoding="utf-8")
          print(json.dumps({"restored_current_files":len(current),"before_files":len(before),"copied":len(copied),"restored_ui":len(restored_ui),"env_excluded":len(env_metadata),"migrations_quarantined":len(migration_meta)},ensure_ascii=False))
          PY

      - name: Run dependency and build diagnostics without discarding recovery
        shell: bash
        run: |
          set +e
          npm ci --ignore-scripts > /tmp/recovery-npm-ci.log 2>&1
          npm_status=$?
          build_status=125
          if [ "$npm_status" -eq 0 ]; then
            VITE_SUPABASE_URL="https://ci-placeholder.supabase.co" \
            VITE_SUPABASE_ANON_KEY="sb_publishable_ci_placeholder" \
            VITE_SUPABASE_PUBLISHABLE_KEY="sb_publishable_ci_placeholder" \
            npm run build > /tmp/recovery-build.log 2>&1
            build_status=$?
          fi
          mkdir -p docs/recovery
          {
            echo "# Recovery branch build preflight"
            echo
            echo "- npm ci --ignore-scripts exit code: $npm_status"
            echo "- npm run build exit code: $build_status"
            echo
            echo "This preflight does not delete recovered code. A failed check indicates a dependency/type/configuration issue to fix before merge."
            echo
            echo "## npm ci log tail"
            echo '~~~text'
            if [ -f /tmp/recovery-npm-ci.log ]; then tail -n 35 /tmp/recovery-npm-ci.log; else echo "No log"; fi
            echo '~~~'
            echo
            echo "## build log tail"
            echo '~~~text'
            if [ -f /tmp/recovery-build.log ]; then tail -n 50 /tmp/recovery-build.log; else echo "Build not run"; fi
            echo '~~~'
          } > docs/recovery/RECOVERY_PREFLIGHT_2026-10-17.md
          rm -f tsconfig.tsbuildinfo
          echo "npm ci status=$npm_status; build status=$build_status"
          exit 0

      - name: Commit recovered files on the isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "recovery: preserve Bolt snapshot and pre-failure UI on isolated branch"
          git push origin HEAD:recovery/bolt-snapshot-2026-10-17
