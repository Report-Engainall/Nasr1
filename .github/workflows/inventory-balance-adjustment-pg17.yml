name: Inventory Balance Adjustment PostgreSQL 17 Acceptance

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261018080000_inventory_write_boundary_and_reorder_point.sql"
      - "supabase/migrations/20261116110000_inventory_balance_adjustment_command.sql"
      - "supabase/migrations/20261018070000_inventory_transfer_command.sql"
      - "supabase/migrations/20261019240000_inventory_transfer_batches.sql"
      - "supabase/migrations/20261117190000_inventory_batch_allocation_fefo.sql"
      - "supabase/migrations/20261117240000_inventory_transfer_replay_scope_guard.sql"
      - "supabase/migrations/20261126110000_inventory_transfer_replay_endpoint_guard.sql"
      - "supabase/tests/inventory_transfer_replay_scope_guard.sql"
      - "supabase/tests/inventory_transfer_replay_endpoint_guard.sql"
      - "supabase/migrations/20261116111000_inventory_adjustment_invariants.sql"
      - "supabase/migrations/20261116112000_inventory_adjustment_authorization_v2.sql"
      - "supabase/migrations/20261116113000_inventory_adjustment_capability_v2.sql"
      - "supabase/migrations/20261116121000_authorization_profile_scopes_v2.sql"
      - "supabase/migrations/20261116122000_scope_inventory_adjustment_authorization.sql"
      - "supabase/migrations/20261116123000_authorization_scope_account_boundary.sql"
      - "supabase/migrations/20261116125000_authorization_scope_resource_listing.sql"
      - "supabase/migrations/20261116126000_authorization_profile_decision_simulator.sql"
      - "supabase/migrations/20261116130000_inventory_scope_enforcement_v2.sql"
      - "supabase/tests/inventory_balance_adjustment.sql"
      - ".github/workflows/inventory-balance-adjustment-pg17.yml"
      - "docs/execution/P2_INVENTORY_TRANSFER_REPLAY_ACCEPTANCE_CHECKPOINT_2026-11-26.md"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261018080000_inventory_write_boundary_and_reorder_point.sql"
      - "supabase/migrations/20261116110000_inventory_balance_adjustment_command.sql"
      - "supabase/migrations/20261018070000_inventory_transfer_command.sql"
      - "supabase/migrations/20261019240000_inventory_transfer_batches.sql"
      - "supabase/migrations/20261117190000_inventory_batch_allocation_fefo.sql"
      - "supabase/migrations/20261117240000_inventory_transfer_replay_scope_guard.sql"
      - "supabase/migrations/20261126110000_inventory_transfer_replay_endpoint_guard.sql"
      - "supabase/tests/inventory_transfer_replay_scope_guard.sql"
      - "supabase/tests/inventory_transfer_replay_endpoint_guard.sql"
      - "supabase/tests/inventory_balance_adjustment.sql"
      - ".github/workflows/inventory-balance-adjustment-pg17.yml"
      - "docs/execution/P2_INVENTORY_TRANSFER_REPLAY_ACCEPTANCE_CHECKPOINT_2026-11-26.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-balance-adjustment-pg17-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  inventory-balance-adjustment:
    name: PostgreSQL 17 atomic adjustment and denial tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply command migration and exercise manager/staff/tenant paths
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file supabase/tests/inventory_balance_adjustment.sql
      - name: Verify transfer warehouse scope precedes replay locks on PostgreSQL 17
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command "CREATE DATABASE inventory_transfer_scope_test"
          psql "postgresql://postgres:postgres@localhost:5432/inventory_transfer_scope_test" --no-psqlrc --set ON_ERROR_STOP=1 --file supabase/tests/inventory_transfer_replay_scope_guard.sql
      - name: Verify endpoint replay and single/batch FEFO lot lineage on PostgreSQL 17
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command "CREATE DATABASE inventory_transfer_endpoint_test"
          psql "postgresql://postgres:postgres@localhost:5432/inventory_transfer_endpoint_test" --no-psqlrc --set ON_ERROR_STOP=1 --file supabase/tests/inventory_transfer_replay_endpoint_guard.sql
