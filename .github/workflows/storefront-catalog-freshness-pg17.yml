name: Storefront Catalog Freshness PostgreSQL 17

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261120140000_storefront_catalog_product_freshness.sql"
      - "supabase/tests/storefront_catalog_product_freshness.sql"
      - ".github/workflows/storefront-catalog-freshness-pg17.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261120140000_storefront_catalog_product_freshness.sql"
      - "supabase/tests/storefront_catalog_product_freshness.sql"
      - ".github/workflows/storefront-catalog-freshness-pg17.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-catalog-freshness-pg17-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  postgres17-catalog-freshness:
    name: PostgreSQL 17 storefront freshness and tenant privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify anonymous/authenticated projections, tenant isolation, availability and exact source timestamp
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file supabase/tests/storefront_catalog_product_freshness.sql
