name: Production DB backup and PostgreSQL 17 restore rehearsal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Explicitly authorize a read-only production dump and restore into an isolated GitHub-hosted PostgreSQL 17 target."
        required: true
        type: choice
        default: "NO"
        options:
          - "NO"
          - "YES_READ_ONLY_BACKUP_AND_RESTORE"

permissions:
  contents: read
  actions: write
  packages: read

concurrency:
  group: nasr1-production-db-backup-restore
  cancel-in-progress: false

jobs:
  backup-and-restore:
    name: Encrypted production dump and isolated restore
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'YES_READ_ONLY_BACKUP_AND_RESTORE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BACKUP_DIR: /tmp/nasr1-production-db-backup
      RESTORE_DIR: /tmp/nasr1-production-db-restore

    steps:
      - name: Checkout selected main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate explicit gate and protected secrets
        shell: bash
        env:
          PRODUCTION_DB_URL: ${{ secrets.NASR1_PRODUCTION_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.NASR1_BACKUP_ENCRYPTION_PASSPHRASE }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          set +x
          test "$CONFIRMATION" = "YES_READ_ONLY_BACKUP_AND_RESTORE"
          test -n "$PRODUCTION_DB_URL" || { echo "::error::Missing NASR1_PRODUCTION_DB_URL repository secret."; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::Missing NASR1_BACKUP_ENCRYPTION_PASSPHRASE repository secret."; exit 1; }

          node --input-type=module <<'NODE'
          const u = new URL(process.env.PRODUCTION_DB_URL);
          if (!["postgres:", "postgresql:"].includes(u.protocol)) throw new Error("Expected a PostgreSQL URL.");
          if (!u.hostname.endsWith(".pooler.supabase.com")) throw new Error("Use the Supabase session-pooler hostname, not the direct database hostname.");
          if (u.port !== "5432") throw new Error("Use session pooler port 5432; transaction pooler and direct connections are not accepted.");
          if (decodeURIComponent(u.username) !== "postgres.mrcyqezbhpncuvaehwgf") throw new Error("Database URL username does not match the approved project.");
          if (u.pathname !== "/postgres" || !u.password) throw new Error("Database URL must target /postgres and include its URL-encoded password.");
          if (process.env.BACKUP_PASSPHRASE.length < 32) throw new Error("Encryption passphrase must contain at least 32 characters.");
          console.log("Connection shape and encryption-secret strength validated; credentials were not printed.");
          NODE

          umask 077
          mkdir -p "$BACKUP_DIR"
          printf '%s' "$BACKUP_PASSPHRASE" > "$RUNNER_TEMP/nasr1-backup-passphrase"
          chmod 600 "$RUNNER_TEMP/nasr1-backup-passphrase"
          unset BACKUP_PASSPHRASE
          echo "::add-mask::$PRODUCTION_DB_URL"
          echo "::add-mask::$(cat "$RUNNER_TEMP/nasr1-backup-passphrase")"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.84.2

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends postgresql-client
          psql --version
          supabase --version

      - name: Capture read-only production baseline
        id: source-baseline
        shell: bash
        env:
          PRODUCTION_DB_URL: ${{ secrets.NASR1_PRODUCTION_DB_URL }}
        run: |
          set -euo pipefail
          set +x
          psql "$PRODUCTION_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "SHOW server_version;" > "$BACKUP_DIR/source-server-version.txt"
          psql "$PRODUCTION_DB_URL" -X -qAt -F '|' -v ON_ERROR_STOP=1 \
            -c "SELECT e.extname || '|' || e.extversion || '|' || n.nspname FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace ORDER BY e.extname;" \
            > "$BACKUP_DIR/source-extensions.tsv"
          psql "$PRODUCTION_DB_URL" -X -qAt -F '|' -v ON_ERROR_STOP=1 \
            -c "SELECT count(*)::text || '|' || coalesce(max(version)::text, '') FROM supabase_migrations.schema_migrations;" \
            > "$BACKUP_DIR/source-migration-history.tsv"

          # Match Supabase CLI 2.84.2 data-dump exclusions. Table names and counts
          # remain inside the encrypted archive, never in Actions logs.
          psql "$PRODUCTION_DB_URL" -X -qAt -F '|' -v ON_ERROR_STOP=1 \
            > "$BACKUP_DIR/source-counts.tsv" <<'SQL'
          SELECT format(
            'SELECT %L::text || %L || count(*)::text FROM %I.%I;',
            n.nspname || '.' || c.relname, '|', n.nspname, c.relname
          )
          FROM pg_class AS c
          JOIN pg_namespace AS n ON n.oid = c.relnamespace
          WHERE c.relkind IN ('r', 'p')
            AND n.nspname <> 'information_schema'
            AND n.nspname !~ '^pg_'
            AND n.nspname NOT IN (
              'graphql', 'graphql_public', 'pgsodium', 'pgsodium_masks', 'pgtle',
              'repack', 'tiger', 'tiger_data', 'topology', 'vault', 'extensions',
              'pgbouncer', 'realtime', 'supabase_migrations', '_analytics',
              '_realtime', '_supavisor'
            )
            AND n.nspname !~ '^timescaledb_'
            AND n.nspname !~ '^_timescaledb_'
            AND NOT (
              (n.nspname = 'auth' AND c.relname = 'schema_migrations')
              OR (n.nspname = 'storage' AND c.relname = 'migrations')
              OR (n.nspname = 'supabase_functions' AND c.relname = 'migrations')
            )
          ORDER BY n.nspname, c.relname
          \gexec
          SQL

          test -s "$BACKUP_DIR/source-counts.tsv"
          if ! grep -Eq '^17([.][0-9]+){1,3}$' "$BACKUP_DIR/source-server-version.txt"; then
            echo "::error::Production database is not PostgreSQL 17; stopping before dump."
            exit 1
          fi

      - name: Dump production roles, schema and data (read-only)
        id: dump
        shell: bash
        env:
          PRODUCTION_DB_URL: ${{ secrets.NASR1_PRODUCTION_DB_URL }}
        run: |
          set -euo pipefail
          set +x
          supabase db dump --db-url "$PRODUCTION_DB_URL" -f "$BACKUP_DIR/roles.sql" --role-only
          supabase db dump --db-url "$PRODUCTION_DB_URL" -f "$BACKUP_DIR/schema.sql"
          supabase db dump --db-url "$PRODUCTION_DB_URL" -f "$BACKUP_DIR/data.sql" --data-only --use-copy

          for file in roles.sql schema.sql data.sql; do
            test -s "$BACKUP_DIR/$file" || { echo "::error::Supabase CLI produced an empty $file."; exit 1; }
          done
          grep -q "session_replication_role" "$BACKUP_DIR/data.sql"
          sha256sum "$BACKUP_DIR/roles.sql" "$BACKUP_DIR/schema.sql" "$BACKUP_DIR/data.sql" > "$BACKUP_DIR/dump-sha256.txt"
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Encrypt and validate the logical backup archive
        id: encrypt
        if: steps.dump.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +x
          table_count="$(wc -l < "$BACKUP_DIR/source-counts.tsv" | tr -d ' ')"
          row_total="$(awk -F'|' '{ total += $2 } END { printf "%.0f", total }' "$BACKUP_DIR/source-counts.tsv")"
          extension_count="$(wc -l < "$BACKUP_DIR/source-extensions.tsv" | tr -d ' ')"
          migration_summary="$(cat "$BACKUP_DIR/source-migration-history.tsv")"
          {
            echo "repository=Report-Engainall/Nasr1"
            echo "source_project_ref=mrcyqezbhpncuvaehwgf"
            echo "source_postgres_version=$(cat "$BACKUP_DIR/source-server-version.txt")"
            echo "production_migrations_count=${migration_summary%%|*}"
            echo "production_latest_migration=${migration_summary#*|}"
            echo "source_table_count=$table_count"
            echo "source_row_count=$row_total"
            echo "source_extension_count=$extension_count"
            echo "source_sha=$GITHUB_SHA"
            echo "created_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "scope=Supabase logical roles, non-managed schema and data. Storage binary objects, Edge Function deployments, project settings and secret values are excluded."
          } > "$BACKUP_DIR/manifest.txt"

          (
            cd "$BACKUP_DIR"
            sha256sum roles.sql schema.sql data.sql source-counts.tsv source-extensions.tsv source-server-version.txt source-migration-history.tsv manifest.txt > SHA256SUMS
            tar -czf nasr1-production-db-backup.tar.gz \
              roles.sql schema.sql data.sql source-counts.tsv source-extensions.tsv \
              source-server-version.txt source-migration-history.tsv manifest.txt SHA256SUMS
            gpg --batch --yes --quiet --pinentry-mode loopback \
              --passphrase-file "$RUNNER_TEMP/nasr1-backup-passphrase" \
              --symmetric --cipher-algo AES256 \
              --output nasr1-production-db-backup.tar.gz.gpg \
              nasr1-production-db-backup.tar.gz
            gpg --batch --yes --quiet --pinentry-mode loopback \
              --passphrase-file "$RUNNER_TEMP/nasr1-backup-passphrase" \
              --decrypt nasr1-production-db-backup.tar.gz.gpg | tar -tzf - > /dev/null
            sha256sum nasr1-production-db-backup.tar.gz.gpg > nasr1-production-db-backup.tar.gz.gpg.sha256
          )

          test -s "$BACKUP_DIR/nasr1-production-db-backup.tar.gz.gpg"
          test -s "$BACKUP_DIR/nasr1-production-db-backup.tar.gz.gpg.sha256"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "AES-256 encrypted logical archive passed a decrypt/list integrity check." >> "$GITHUB_STEP_SUMMARY"
          echo "Only encrypted ciphertext and its checksum will be uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted backup artifact only
        if: steps.encrypt.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nasr1-production-db-backup-${{ github.run_id }}
          path: |
            /tmp/nasr1-production-db-backup/nasr1-production-db-backup.tar.gz.gpg
            /tmp/nasr1-production-db-backup/nasr1-production-db-backup.tar.gz.gpg.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Start an isolated Supabase PostgreSQL 17 restore target
        id: restore-stack
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p "$RESTORE_DIR/supabase"
          cp supabase/config.toml "$RESTORE_DIR/supabase/config.toml"
          sed -i 's/^project_id = .*/project_id = "nasr1-prod-restore"/' "$RESTORE_DIR/supabase/config.toml"
          cd "$RESTORE_DIR"

          registry=ghcr.io
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/nasr1-restore-start-$attempt.log"
            if SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry" timeout 210s supabase start \
              --exclude realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta \
              --ignore-health-check > "$log_file" 2>&1; then
              echo "Isolated Supabase services started." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if ! grep -Eiq 'toomanyrequests|429[[:space:]]+Too Many Requests|rate.limit' "$log_file"; then
              cat "$log_file"
              echo "::error title=Restore target startup failed::Supabase local services could not start."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              cat "$log_file"
              echo "::error title=Restore target image pull failed::Registry throttling persisted across registries."
              exit 1
            fi
            supabase stop --no-backup >/dev/null 2>&1 || true
            if [ "$registry" = "ghcr.io" ]; then registry=docker.io; fi
            sleep $((attempt * 15))
          done

          supabase status -o env --override-name db.url=RESTORE_DB_URL > "$RESTORE_DIR/status.env"
          restore_line="$(grep '^RESTORE_DB_URL=' "$RESTORE_DIR/status.env" | head -n 1 || true)"
          RESTORE_DB_URL="${restore_line#*=}"
          RESTORE_DB_URL="${RESTORE_DB_URL#\"}"
          RESTORE_DB_URL="${RESTORE_DB_URL%\"}"
          test -n "$RESTORE_DB_URL" || { echo "::error::Could not obtain local restore database URL."; exit 1; }
          echo "::add-mask::$RESTORE_DB_URL"
          printf '%s' "$RESTORE_DB_URL" > "$RUNNER_TEMP/nasr1-restore-db-url"
          chmod 600 "$RUNNER_TEMP/nasr1-restore-db-url"

          server_version_num="$(psql "$RESTORE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "SHOW server_version_num;")"
          if [ "$server_version_num" -lt 170000 ] || [ "$server_version_num" -ge 180000 ]; then
            echo "::error::Restore target is not PostgreSQL 17."
            exit 1
          fi
          echo "Local restore target is PostgreSQL 17; production was not modified." >> "$GITHUB_STEP_SUMMARY"

      - name: Restore roles, schema and data into the isolated database
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          set +x
          RESTORE_DB_URL="$(cat "$RUNNER_TEMP/nasr1-restore-db-url")"
          echo "::add-mask::$RESTORE_DB_URL"

          psql "$RESTORE_DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
            -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated;"
          psql "$RESTORE_DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
            -f "$BACKUP_DIR/roles.sql"
          psql "$RESTORE_DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
            -f "$BACKUP_DIR/schema.sql"
          psql "$RESTORE_DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
            -f "$BACKUP_DIR/data.sql"

          psql "$RESTORE_DB_URL" -X -qAt -F '|' -v ON_ERROR_STOP=1 \
            -c "SELECT e.extname || '|' || e.extversion || '|' || n.nspname FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace ORDER BY e.extname;" \
            > "$BACKUP_DIR/restore-extensions.tsv"

          while IFS='|' read -r extension version schema; do
            [ -n "$extension" ] || continue
            if ! grep -Fxq "$extension|$version|$schema" "$BACKUP_DIR/restore-extensions.tsv"; then
              echo "::error::Restore target lacks a production extension or exact version: $extension."
              exit 1
            fi
          done < "$BACKUP_DIR/source-extensions.tsv"

          psql "$RESTORE_DB_URL" -X -qAt -F '|' -v ON_ERROR_STOP=1 \
            > "$BACKUP_DIR/restore-counts.tsv" <<'SQL'
          SELECT format(
            'SELECT %L::text || %L || count(*)::text FROM %I.%I;',
            n.nspname || '.' || c.relname, '|', n.nspname, c.relname
          )
          FROM pg_class AS c
          JOIN pg_namespace AS n ON n.oid = c.relnamespace
          WHERE c.relkind IN ('r', 'p')
            AND n.nspname <> 'information_schema'
            AND n.nspname !~ '^pg_'
            AND n.nspname NOT IN (
              'graphql', 'graphql_public', 'pgsodium', 'pgsodium_masks', 'pgtle',
              'repack', 'tiger', 'tiger_data', 'topology', 'vault', 'extensions',
              'pgbouncer', 'realtime', 'supabase_migrations', '_analytics',
              '_realtime', '_supavisor'
            )
            AND n.nspname !~ '^timescaledb_'
            AND n.nspname !~ '^_timescaledb_'
            AND NOT (
              (n.nspname = 'auth' AND c.relname = 'schema_migrations')
              OR (n.nspname = 'storage' AND c.relname = 'migrations')
              OR (n.nspname = 'supabase_functions' AND c.relname = 'migrations')
            )
          ORDER BY n.nspname, c.relname
          \gexec
          SQL

          awk -F'|' '
            FNR == NR { expected[$1] = $2; next }
            ($1 in expected) {
              if (expected[$1] != $2) {
                print "Row-count mismatch after restore: " $1 > "/dev/stderr"
                failed = 1
              }
              delete expected[$1]
            }
            END {
              for (table in expected) {
                print "Missing restored table: " table > "/dev/stderr"
                failed = 1
              }
              exit failed
            }
          ' "$BACKUP_DIR/source-counts.tsv" "$BACKUP_DIR/restore-counts.tsv"

          source_tables="$(wc -l < "$BACKUP_DIR/source-counts.tsv" | tr -d ' ')"
          source_rows="$(awk -F'|' '{ total += $2 } END { printf "%.0f", total }' "$BACKUP_DIR/source-counts.tsv")"
          restore_version="$(psql "$RESTORE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "SHOW server_version;")"
          {
            echo "## Production database backup and PostgreSQL 17 restore: PASS"
            echo
            echo "- Source: read-only Supabase session-pooler logical dump."
            echo "- Restore target: disposable local Supabase PostgreSQL 17."
            echo "- Exact source table inventory checked: $source_tables."
            echo "- Total source rows reconciled: $source_rows."
            echo "- Production extension names, schemas and versions: matched."
            echo "- Production database DDL/DML: none."
            echo "- Restore target version: $restore_version."
            echo "- Backup artifact: AES-256 encrypted, 7-day retention, ciphertext only."
            echo
            echo "Storage binary objects, Edge Function deployments, project settings, API/JWT secrets and custom-role passwords are not part of this logical database dump."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report backup and restore gate outcome
        if: always()
        shell: bash
        env:
          DUMP_OUTCOME: ${{ steps.dump.outcome }}
          ENCRYPT_OUTCOME: ${{ steps.encrypt.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
        run: |
          set -euo pipefail
          if [ "$DUMP_OUTCOME" = "success" ] && [ "$ENCRYPT_OUTCOME" = "success" ] && [ "$RESTORE_OUTCOME" = "success" ]; then
            echo "Encrypted logical backup and isolated PostgreSQL 17 restore both passed."
          elif [ "$ENCRYPT_OUTCOME" = "success" ]; then
            echo "::error title=Restore rehearsal not accepted::Encrypted backup artifact was uploaded, but restore did not pass."
            exit 1
          else
            echo "::error title=Backup gate not accepted::A complete encrypted backup artifact was not produced."
            exit 1
          fi

      - name: Stop local Supabase and remove plaintext material
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$RESTORE_DIR/supabase/config.toml" ]; then
            (cd "$RESTORE_DIR" && supabase stop --no-backup >/dev/null 2>&1)
          fi
          rm -rf "$BACKUP_DIR" "$RESTORE_DIR"
          rm -f "$RUNNER_TEMP/nasr1-backup-passphrase" "$RUNNER_TEMP/nasr1-restore-db-url"
          echo "Ephemeral restore stack stopped; plaintext dumps and passphrase file removed from the runner."
