name: Storefront Product Feedback PostgreSQL 17 Acceptance

on:
  push:
    branches: [main]
    paths:
      - "src/components/StorefrontProductReviews.tsx"
      - "src/components/StorefrontProductReviews.test.tsx"
      - "src/components/StorefrontProductQuestions.tsx"
      - "src/components/StorefrontProductQuestions.test.tsx"
      - "scripts/test-storefront-product-reviews.mjs"
      - "scripts/test-storefront-product-questions.mjs"
      - "scripts/test-cash-expense-commitments.mjs"
      - "scripts/test-authorization-capability-registry.mjs"
      - "scripts/test-inventory-adjustment-v2-authorization.mjs"
      - "scripts/test-decision-outcome-snapshot-required.mjs"
      - "scripts/test-decision-policy-learning-candidate.mjs"
      - "scripts/test-cash-expense-journal-posting.mjs"
      - "scripts/test-customer-order-amendment-replay.mjs"
      - "scripts/test-customer-receivable-aging-identity.mjs"
      - "scripts/test-price-grid-atomicity.mjs"
      - "scripts/test-business-health-supplier-payable-activity.mjs"
      - "scripts/test-claim-evidence-drilldown.mjs"
      - "scripts/test-purchase-receipt-accounting.mjs"
      - "scripts/test-inventory-batch-fefo.mjs"
      - "scripts/test-ai-prompt-governance.mjs"
      - "scripts/test-decision-outcome-snapshot-required.mjs"
      - "src/components/CashExpenseCommitmentWorkspace.tsx"
      - "src/components/CashExpenseCommitmentWorkspace.test.tsx"
      - "src/lib/cash-expense-commitments.ts"
      - "src/lib/cash-expense-commitments.test.ts"
      - "src/lib/intelligence/cashflow-schedule-client.ts"
      - "src/lib/intelligence/cashflow-schedule-client.operating-commitments.test.ts"
      - "src/components/intelligence/CashflowForecastCard.tsx"
      - "scripts/seed-p2-local-playwright.mjs"
      - "scripts/prepare-p2-local-storage-migrations.mjs"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/storefront-feedback-postgres17.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/components/StorefrontProductReviews.tsx"
      - "src/components/StorefrontProductReviews.test.tsx"
      - "src/components/StorefrontProductQuestions.tsx"
      - "src/components/StorefrontProductQuestions.test.tsx"
      - "scripts/test-storefront-product-reviews.mjs"
      - "scripts/test-storefront-product-questions.mjs"
      - "scripts/test-cash-expense-commitments.mjs"
      - "scripts/test-authorization-capability-registry.mjs"
      - "scripts/test-inventory-adjustment-v2-authorization.mjs"
      - "scripts/test-decision-outcome-snapshot-required.mjs"
      - "scripts/test-decision-policy-learning-candidate.mjs"
      - "scripts/test-cash-expense-journal-posting.mjs"
      - "scripts/test-customer-order-amendment-replay.mjs"
      - "scripts/test-customer-receivable-aging-identity.mjs"
      - "scripts/test-price-grid-atomicity.mjs"
      - "scripts/test-business-health-supplier-payable-activity.mjs"
      - "scripts/test-claim-evidence-drilldown.mjs"
      - "scripts/test-purchase-receipt-accounting.mjs"
      - "scripts/test-inventory-batch-fefo.mjs"
      - "scripts/test-ai-prompt-governance.mjs"
      - "scripts/test-decision-outcome-snapshot-required.mjs"
      - "src/components/CashExpenseCommitmentWorkspace.tsx"
      - "src/components/CashExpenseCommitmentWorkspace.test.tsx"
      - "src/lib/cash-expense-commitments.ts"
      - "src/lib/cash-expense-commitments.test.ts"
      - "src/lib/intelligence/cashflow-schedule-client.ts"
      - "src/lib/intelligence/cashflow-schedule-client.operating-commitments.test.ts"
      - "src/components/intelligence/CashflowForecastCard.tsx"
      - "scripts/seed-p2-local-playwright.mjs"
      - "scripts/prepare-p2-local-storage-migrations.mjs"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/storefront-feedback-postgres17.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: storefront-feedback-pg17-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  storefront-feedback:
    name: Storefront reviews and questions on isolated PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install project dependencies from the verified lockfile
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/storefront-feedback-bun-install-${attempt}.log"
            if bun install --frozen-lockfile --registry=https://registry.npmjs.org 2>&1 | tee "$log_file"; then
              exit 0
            fi
            if ! grep -Eiq '429|Too Many Requests|rate.?limit' "$log_file"; then
              echo "::error::Dependency installation failed for a non-rate-limit reason."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=Package registry throttling::HTTP 429 persisted after three bounded attempts."
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.84.2

      - name: Verify disposable container runtime
        run: docker info

      - name: Prepare temporary migration copy
        shell: bash
        run: |
          set -euo pipefail
          local_project="$RUNNER_TEMP/p2-local-supabase"
          mkdir -p "$local_project/supabase"
          cp -R supabase/. "$local_project/supabase/"
          test -f "$local_project/supabase/config.toml"
          test -d "$local_project/supabase/migrations"
          sed -i '1s/.*/project_id = "storefront-feedback-pg17"/' "$local_project/supabase/config.toml"
          read -r db_port shadow_port < <(node -e 'const net=require("node:net");const servers=[net.createServer(),net.createServer()];Promise.all(servers.map((server)=>new Promise((resolve)=>server.listen(0,"127.0.0.1",()=>resolve(server.address().port))))).then((ports)=>{console.log(ports.join(" "));servers.forEach((server)=>server.close());});')
          test -n "$db_port" && test -n "$shadow_port" && test "$db_port" != "$shadow_port"
          sed -i "/^\[db\]$/a port = ${db_port}\nshadow_port = ${shadow_port}" "$local_project/supabase/config.toml"
          node scripts/prepare-p2-local-storage-migrations.mjs "$local_project/supabase/migrations"

      - name: Authenticate read-only to GHCR for local Supabase images
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Start isolated local Supabase Auth and PostgreSQL 17
        timeout-minutes: 13
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p2-local-supabase"
          test "$(sed -n '1p' supabase/config.toml)" = 'project_id = "storefront-feedback-pg17"'
          registry=ghcr.io
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/p2-local-supabase-start-${attempt}.log"
            if SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry" timeout 210s supabase start --exclude realtime,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta --ignore-health-check 2>&1 | tee "$log_file"; then
              echo "Disposable Supabase services started using $registry."
              exit 0
            fi
            if ! grep -Eiq 'toomanyrequests|429[[:space:]]+Too Many Requests|rate.limit' "$log_file"; then
              echo "::error title=Local Supabase startup failed::Non-retryable error; inspect the startup log."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=Local Supabase image pull exhausted retries::Registry throttling persisted."
              exit 1
            fi
            supabase stop --no-backup >/dev/null 2>&1 || true
            if [ "$registry" = "ghcr.io" ]; then registry=docker.io; fi
            sleep $((attempt * 15))
          done

      - name: Apply repository migrations to local PostgreSQL 17
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p2-local-supabase"
          timeout 12m supabase db reset --local

      - name: Export local-only Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p2-local-supabase"
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=TEST_DATABASE_URL | \
            sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Create ephemeral customer, manager and tenant fixtures
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/seed-p2-local-playwright.mjs

      - name: Accept Authorization V2 capability parity and customer/staff scope isolation on PostgreSQL 17
        run: node scripts/test-authorization-capability-registry.mjs

      - name: Accept inventory adjustment and exact warehouse-scope write denial on PostgreSQL 17
        run: node scripts/test-inventory-adjustment-v2-authorization.mjs

      - name: Accept immutable ranked decision snapshots and command metadata on PostgreSQL 17
        run: node scripts/test-decision-outcome-snapshot-required.mjs

      - name: Accept verified-purchase review submission, moderation, privacy and tenant isolation
        run: node scripts/test-storefront-product-reviews.mjs

      - name: Accept customer product questions, moderation, privacy and tenant isolation
        run: node scripts/test-storefront-product-questions.mjs

      - name: Accept finance commitment source review, maker-checker and journal posting
        run: node scripts/test-cash-expense-commitments.mjs

      - name: Record exact-SHA proof boundary
        if: always()
        shell: bash
        run: |
          {
            echo "### Storefront product feedback acceptance"
            echo "- The review and question scripts use the exact checked-out source and a disposable local Supabase/PostgreSQL 17 stack."
            echo "- Fixtures are synthetic, tenant-scoped and created only in the local database."
            echo "- Authorization V2 six-role parity, customer/staff scope separation, and resource-specific inventory-write denial run against this exact PostgreSQL 17 migration replay."
            echo "- No hosted Supabase project, production secret, remote migration, production record or production write is used."
            echo "- Review acceptance and question acceptance are reported independently by their dedicated steps."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop disposable Supabase
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/p2-local-supabase" ]; then
            (cd "$RUNNER_TEMP/p2-local-supabase" && supabase stop --no-backup >/dev/null 2>&1) || true
          fi
