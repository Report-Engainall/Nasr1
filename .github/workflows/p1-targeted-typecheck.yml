name: P1 Targeted TypeScript Assurance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-targeted-typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  p1-targeted-typecheck:
    name: Strict TypeScript check for the five P1-owned files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Install the repository's frozen dependency graph
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Install the same pinned Playwright types used by repository E2E CI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw-p1" --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.63.0
          mkdir -p node_modules/@playwright
          if [ -e node_modules/@playwright/test ] || [ -L node_modules/@playwright/test ]; then
            echo "::error::Unexpected existing @playwright/test path; refusing to overwrite it."
            exit 1
          fi
          ln -s "$RUNNER_TEMP/pw-p1/node_modules/@playwright/test" node_modules/@playwright/test

      - name: Typecheck all five P1 files and their imported source graph
        shell: bash
        run: |
          set -euo pipefail
          printf 'Testing SHA: %s\n' "$(git rev-parse HEAD)"
          bun run tsc --noEmit --project tsconfig.p1-typecheck.json

      - name: Verify P1 structural budgets with TypeScript AST (supplemental; not CodeInspector)
        shell: bash
        run: |
          set -euo pipefail
          printf 'Testing SHA: %s\\n' "$(git rev-parse HEAD)"
          bun scripts/test-p1-structural-budget.mjs

      - name: Re-run the two P1-owned Vitest suites
        shell: bash
        run: |
          set -euo pipefail
          bun run vitest run src/test/ai-gateway-logic.test.ts src/test/password-reset-route-security.test.ts
