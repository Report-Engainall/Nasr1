name: Storefront Local Order and Tenant Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/storefront-order-local-proof.yml"
      - ".github/workflows/p2-playwright-critical-paths.yml"
      - "src/**"
      - "supabase/**"
      - "scripts/seed-p2-local-playwright.mjs"
      - "scripts/prepare-p2-local-storage-migrations.mjs"
      - "e2e/critical-path.spec.ts"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lockb"
  push:
    branches: [main]
    paths:
      - ".github/workflows/storefront-order-local-proof.yml"
      - ".github/workflows/p2-playwright-critical-paths.yml"
      - "src/**"
      - "supabase/**"
      - "scripts/seed-p2-local-playwright.mjs"
      - "scripts/prepare-p2-local-storage-migrations.mjs"
      - "e2e/critical-path.spec.ts"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lockb"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  storefront-order-proof:
    name: Authenticated storefront order, manager approval and tenant denial
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Select and checkout exact PR head SHA
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(jq -r '.pull_request.head.sha // .after // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$source_sha" ]; then source_sha="$GITHUB_SHA"; fi
          echo "$source_sha" | grep -Eq '^[0-9a-f]{40}$'
          git fetch --no-tags origin "$source_sha"
          git checkout --detach "$source_sha"
          echo "E2E_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "## Exact source SHA: $source_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies from verified lockfile
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/storefront-order-bun-install-$attempt.log"
            if bun install --frozen-lockfile --registry=https://registry.npmjs.org 2>&1 | tee "$log_file"; then exit 0; fi
            if ! grep -Eiq '429|Too Many Requests|rate.?limit' "$log_file"; then
              echo "::error::Dependency installation failed for a non-rate-limit reason."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then echo "::error::Package registry throttling persisted."; exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.84.2

      - name: Install pinned Playwright runner outside project lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/storefront-order-pw" --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.63.0
          mkdir -p node_modules/@playwright
          ln -s "$RUNNER_TEMP/storefront-order-pw/node_modules/@playwright/test" node_modules/@playwright/test

      - name: Typecheck isolated E2E acceptance
        run: bunx tsc --noEmit -p tsconfig.p2-e2e-typecheck.json

      - name: Cache pinned Chromium
        id: chromium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.63.0-v1

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: "$RUNNER_TEMP/storefront-order-pw/node_modules/.bin/playwright install chromium"

      - name: Verify Chromium libraries
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          browser_bins="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chrome-headless-shell \) -perm -111 -print)"
          [ -n "$browser_bins" ]
          missing=""
          while IFS= read -r browser; do
            [ -n "$browser" ] || continue
            output="$RUNNER_TEMP/storefront-order-ldd-$(basename "$browser").txt"
            if ! ldd "$browser" > "$output" 2>&1; then missing=$missing"$browser:ldd-failed; "; continue; fi
            unresolved="$(awk '/not found/ {print $1}' "$output" | paste -sd ',' -)"
            if [ -n "$unresolved" ]; then missing=$missing"$browser:$unresolved; "; fi
          done <<< "$browser_bins"
          if [ -n "$missing" ]; then
            echo "::warning::Installing only missing Chromium system libraries: $missing"
            timeout 8m "$RUNNER_TEMP/storefront-order-pw/node_modules/.bin/playwright" install-deps chromium
          fi

      - name: Verify local-only container runtime
        run: docker info

      - name: Prepare isolated Supabase migration copy
        shell: bash
        run: |
          set -euo pipefail
          local_project="$RUNNER_TEMP/storefront-order-local"
          mkdir -p "$local_project/supabase"
          cp -R supabase/. "$local_project/supabase/"
          test -f "$local_project/supabase/config.toml"
          sed -i '1s/.*/project_id = "storefront-order-local"/' "$local_project/supabase/config.toml"
          read -r db_port shadow_port < <(node -e 'const net=require("node:net");const s=[net.createServer(),net.createServer()];Promise.all(s.map(x=>new Promise(r=>x.listen(0,"127.0.0.1",()=>r(x.address().port))))).then(p=>{console.log(p.join(" "));s.forEach(x=>x.close());});')
          test -n "$db_port" && test -n "$shadow_port" && test "$db_port" != "$shadow_port"
          sed -i "/^\[db\]$/a port = $db_port\nshadow_port = $shadow_port" "$local_project/supabase/config.toml"
          node scripts/prepare-p2-local-storage-migrations.mjs "$local_project/supabase/migrations"
          test -f "$local_project/supabase/migrations/20261018100000_product_image_storage.sql"

      - name: Authenticate read-only to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Start isolated local Supabase and Storage services
        timeout-minutes: 13
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/storefront-order-local"
          test "$(sed -n '1p' supabase/config.toml)" = 'project_id = "storefront-order-local"'
          registry=ghcr.io
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/storefront-order-supabase-start-$attempt.log"
            if SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry" timeout 210s supabase start --exclude realtime,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta --ignore-health-check 2>&1 | tee "$log"; then exit 0; fi
            if ! grep -Eiq 'toomanyrequests|429[[:space:]]+Too Many Requests|rate.limit' "$log"; then
              echo "::error::Local Supabase startup failed for a non-rate-limit reason."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then echo "::error::Local Supabase image rate limit persisted."; exit 1; fi
            supabase stop --no-backup >/dev/null 2>&1 || true
            registry=docker.io
            sleep $((attempt * 15))
          done

      - name: Apply complete repository migrations to PostgreSQL 17
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/storefront-order-local"
          timeout 12m supabase db reset --local

      - name: Export disposable Supabase environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/storefront-order-local"
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=TEST_DATABASE_URL |
            sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Seed local customers, manager, second tenant and storefront stock
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/seed-p2-local-playwright.mjs

      - name: Build exact source against local Supabase
        shell: bash
        run: |
          set -euo pipefail
          export VITE_LOCAL_SUPABASE_E2E=1
          export VITE_SUPABASE_URL="$SUPABASE_URL"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          export SUPABASE_URL="$SUPABASE_URL"
          export SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          npm run build

      - name: Launch exact built storefront
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_URL="$SUPABASE_URL"
          export SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          npx vite preview --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/storefront-order-preview.log" 2>&1 &
          pid=$!
          echo "$pid" > "$RUNNER_TEMP/storefront-order-preview.pid"
          ready=0
          for attempt in $(seq 1 60); do
            status="$(curl --silent --connect-timeout 2 --max-time 5 --output "$RUNNER_TEMP/storefront-order-home.html" --write-out '%{http_code}' http://127.0.0.1:4173/ || true)"
            if [ "$status" = "200" ] && grep -q "الأغبري" "$RUNNER_TEMP/storefront-order-home.html"; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/storefront-order-preview.log"; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/storefront-order-preview.log"; exit 1; fi

      - name: Prove authenticated checkout, manager approval and cross-tenant denial
        timeout-minutes: 15
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: "$RUNNER_TEMP/storefront-order-pw/node_modules/.bin/playwright test --config=playwright.config.ts --reporter=list e2e/critical-path.spec.ts"

      - name: Record exact-SHA order proof boundary
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### Dedicated storefront order proof"
            echo "- BROWSER_PROVEN only if the authenticated Chromium test passes on E2E_SOURCE_SHA."
            echo "- It asserts persisted order and order number after refresh, separate manager approval, customer status reread, cross-organization denial, invoice, reservation, status history, audit and exactly-once notification."
            echo "- Test identities, application and PostgreSQL are disposable local fixtures only; no hosted Supabase or production write is used."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/storefront-order-diagnostics.log"
          : > "$output"
          docker ps -a --format '{{.Names}} {{.Status}}' | grep -F 'storefront-order-local' >> "$output" || true
          while IFS= read -r container; do
            [ -n "$container" ] || continue
            docker logs --since 15m --tail 250 "$container" 2>&1 |
              grep -Ei 'error|warn|timeout|deadlock|lock|connection|postgres|postgrest|SQLSTATE' |
              sed -E 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g; s/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[JWT_REDACTED]/g' |
              tail -n 250 >> "$output" || true
          done < <(docker ps -a --format '{{.Names}}' | grep -F 'storefront-order-local' || true)
          cat "$output" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop local storefront server and Supabase
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/storefront-order-preview.pid" ]; then kill "$(cat "$RUNNER_TEMP/storefront-order-preview.pid")" >/dev/null 2>&1 || true; fi
          if [ -d "$RUNNER_TEMP/storefront-order-local" ]; then
            (cd "$RUNNER_TEMP/storefront-order-local" && supabase stop --no-backup >/dev/null 2>&1) || true
          fi

      - name: Upload order traces and proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storefront-order-local-proof-${{ github.run_id }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/storefront-order-preview.log
            ${{ runner.temp }}/storefront-order-diagnostics.log
          if-no-files-found: ignore
