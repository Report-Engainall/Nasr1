name: Staff Product Field Projection PostgreSQL 17

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261116090000_staff_product_field_projection.sql"
      - "supabase/tests/staff_product_field_projection.sql"
      - ".github/workflows/staff-product-field-projection-pg17.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261116090000_staff_product_field_projection.sql"
      - "supabase/tests/staff_product_field_projection.sql"
      - ".github/workflows/staff-product-field-projection-pg17.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staff-product-field-projection-pg17-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  field-projection:
    name: Raw RPC privacy and role parity on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout the exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply existing field-projection migration and assert raw RPC responses
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file supabase/tests/staff_product_field_projection.sql
