name: AI Fallback Decision NULL PostgreSQL 17 Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20261024145000_ai_fallback_decision_reject_null.sql"
      - "scripts/test-ai-fallback-decision-null.mjs"
      - ".github/workflows/ai-fallback-decision-null-pg17.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-fallback-decision-null-pg17-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pg17-acceptance:
    name: PostgreSQL 17 runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aghbari_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aghbari_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aghbari_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install from verified Bun lockfile
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --registry=https://registry.npmjs.org --dry-run
          bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Apply migrations and run established PostgreSQL 17 database acceptance
        run: npm run test:db
      - name: Prove NULL fallback telemetry is rejected
        run: node scripts/test-ai-fallback-decision-null.mjs
