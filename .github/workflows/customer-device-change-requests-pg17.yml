name: Customer Device Change Requests PostgreSQL 17

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261117180000_customer_device_change_requests.sql"
      - "supabase/tests/customer_device_change_requests.sql"
      - ".github/workflows/customer-device-change-requests-pg17.yml"
      - "src/components/CustomerDeviceChangeRequests.tsx"
      - "src/components/CustomerDeviceChangeRequests.test.tsx"
      - "src/components/CustomerMyDevicesPage.tsx"
      - "src/components/DeviceManagement.tsx"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261117180000_customer_device_change_requests.sql"
      - "supabase/tests/customer_device_change_requests.sql"
      - ".github/workflows/customer-device-change-requests-pg17.yml"
      - "src/components/CustomerDeviceChangeRequests.tsx"
      - "src/components/CustomerDeviceChangeRequests.test.tsx"
      - "src/components/CustomerMyDevicesPage.tsx"
      - "src/components/DeviceManagement.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-device-change-requests-pg17-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Customer device request lifecycle and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout the exact triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply the migration to isolated PostgreSQL 17 and execute lifecycle acceptance
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            --file supabase/tests/customer_device_change_requests.sql
