name: P1 Admin Context Verification

on:
  push:
    branches:
      - main
    paths:
      - "src/components/AghbariApp.tsx"
      - "src/lib/auth.tsx"
      - "src/lib/auth-phone.ts"
      - "src/lib/auth-phone.test.ts"
      - "src/components/Login.tsx"
      - "src/components/Login.phone-signup.test.tsx"
      - "src/routes/register.tsx"
      - "supabase/migrations/20261111213752_public_self_service_customer_registration.sql"
      - "src/test/public-self-service-customer-registration-migration.test.ts"
      - "supabase/migrations/20261111214542_pending_customer_order_creation_gate.sql"
      - "src/components/OperationsCenter.tsx"
      - "src/components/OperationsExceptionCenter.tsx"
      - "src/lib/operations-exceptions.ts"
      - "src/lib/operations-exceptions.test.ts"
      - "src/components/SupplierInvoiceWorkspace.tsx"
      - "src/lib/supplier-invoice-messages.ts"
      - "src/lib/supplier-invoice-messages.test.ts"
      - "supabase/migrations/20261110103000_admin_import_snapshot_replay_safety.sql"
      - "src/test/admin-import-snapshot-replay-safety-migration.test.ts"
      - "src/lib/bound-idempotency-key.ts"
      - "src/lib/bound-idempotency-key.test.ts"
      - "src/components/CustomerOrders.tsx"
      - "tsconfig.p1-typecheck.json"
      - "src/components/BulkProductImageUploader.tsx"
      - "src/components/BulkProductImageUploader.test.tsx"
      - "src/lib/product-image-batch-match.ts"
      - "src/lib/product-image-batch-match.test.ts"
      - "src/lib/unified-import.ts"
      - "src/lib/unified-import-headers.test.ts"
      - "src/routes/profile.tsx"
      - "src/lib/profile-access.ts"
      - "src/lib/profile-access.test.ts"
      - "src/components/intelligence/IntelligenceWorkspace.tsx"
      - "src/components/intelligence/EvidenceSourceComparisonPanel.test.tsx"
      - "src/components/CustomerWorkflows.tsx"
      - "src/components/CustomerAccountPasswordPage.tsx"
      - "src/lib/api.ts"
      - "src/lib/dashboard-low-stock.ts"
      - "src/lib/dashboard-low-stock.test.ts"
      - "src/lib/product-admin-pagination.ts"
      - "src/lib/product-admin-pagination.test.ts"
      - "src/lib/customer-directory.ts"
      - "src/lib/customer-directory.test.ts"
      - "src/lib/business-inventory-valuation.ts"
      - "src/lib/business-inventory-valuation.test.ts"
      - "src/lib/useFetch.ts"
      - "src/lib/useFetch.test.tsx"
      - "tsconfig.p1-typecheck.json"
      - "src/lib/admin-record-context.ts"
      - "src/lib/admin-record-context.test.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/p1-admin-context-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-admin-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-typecheck:
    name: Vitest and strict TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies with the project build tool
        run: bun install --frozen-lockfile
      - name: Run Vitest regression suite
        run: bun run test
      - name: Run P1 strict TypeScript check
        run: bunx tsc --noEmit -p tsconfig.p1-typecheck.json

      - name: Build production application bundle
        run: bun run build
