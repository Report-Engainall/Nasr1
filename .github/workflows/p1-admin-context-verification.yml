permissions:
  contents: read

concurrency:
  group: p1-admin-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-typecheck:
    name: Vitest and strict TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit under test
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies with the project build tool
        id: install
        run: bun install --frozen-lockfile
      - name: Run Vitest regression suite
        run: bun run test
      - name: Run P1 strict TypeScript check (even if Vitest fails)
        if: always() && steps.install.outcome == 'success'
        run: bunx tsc --noEmit -p tsconfig.p1-typecheck.json

      - name: Build production application bundle (even if an acceptance test fails)
        if: always() && steps.install.outcome == 'success'
        run: bun run build
