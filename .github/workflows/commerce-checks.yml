name: Aghbari Commerce checks

on:
  push:
    branches:
      - main
      - fix/commerce-completion-20261009
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aghbari_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aghbari_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aghbari_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Bun for frozen-lockfile verification
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Verify Bun lockfile matches package.json
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org --dry-run
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install dependencies from verified Bun lockfile
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/bun-install-attempt-${attempt}.log"
            if bun install --frozen-lockfile --registry=https://registry.npmjs.org 2>&1 | tee "$log_file"; then
              echo "Frozen-lockfile dependency installation succeeded on attempt ${attempt}."
              exit 0
            fi
            if ! grep -Eiq '429|Too Many Requests|rate.?limit' "$log_file"; then
              echo "::error::Dependency installation failed for a non-rate-limit reason; not retrying."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=Package registry throttling::HTTP 429 persisted after three bounded attempts."
              exit 1
            fi
            delay=$((attempt * 20))
            echo "::warning::Package cache returned HTTP 429; retrying after ${delay}s (attempt ${attempt}/3)."
            sleep "$delay"
          done
      # Full-tree tsc is not a valid gate yet: legacy recovery files under src/ are not part of the active TanStack app and have unresolved React Router/Zustand dependencies. Unit tests, lint, build and route smoke checks remain the acceptance gates until that legacy tree is separated.
      - name: Unit tests
        run: npm test
      - name: Focused TypeScript check for P2 Outbox handler and tests
        run: >-
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext
          --moduleResolution bundler --allowImportingTsExtensions
          --lib ES2022,DOM --types node
          supabase/functions/_shared/bounded-body.ts
          supabase/functions/outbox-worker/logic.ts
          supabase/functions/outbox-worker/handler.ts
          src/test/outbox-worker-handler.test.ts
          src/test/outbox-worker-source.test.ts
      - name: Apply all migrations to isolated PostgreSQL 17 and verify core workflows
        shell: bash
        run: |
          set +e
          npm run test:db 2>&1 | tee /tmp/aghbari-db-migration.log
          db_status=${PIPESTATUS[0]}
          if [ "$db_status" -ne 0 ]; then
            echo "::error title=Database migration diagnostic::The isolated migration/workflow command failed; structured error follows."
            grep -E '^(MIGRATION_FAILED|MIGRATION_DIAGNOSTIC|DATABASE_ACCEPTANCE_FAILED) ' /tmp/aghbari-db-migration.log | tail -n 4 | while IFS= read -r line; do
              echo "::error title=Database root cause::$line"
            done
            grep -E 'Error:|error:|AssertionError:|not ok|FAIL|ERROR' /tmp/aghbari-db-migration.log | tail -n 20 | while IFS= read -r line; do
              echo "::error title=Database test failure::$line"
            done
          fi
          exit "$db_status"
      - name: Generate exact-head PostgreSQL RPC/function inventory
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/public-rpc-function-inventory.md"
          npm run api-ops:rpc-inventory > "$report"
          grep -Fxq "BEGIN_PUBLIC_RPC_CONTRACT_INVENTORY" "$report"
          grep -Fxq "END_PUBLIC_RPC_CONTRACT_INVENTORY" "$report"
          summary="$(grep '^RPC_INVENTORY_SUMMARY ' "$report" | tail -n 1)"
          if [[ ! "$summary" =~ ^RPC_INVENTORY_SUMMARY\ functions=[0-9]+\ matched=[0-9]+\ unmatched=0\ migration_files=[0-9]+$ ]]; then
            echo "::error::RPC/function inventory did not reconcile completely to migration source."
            echo "$summary"
            exit 1
          fi
          inventory_path="$RUNNER_TEMP/public-rpc-function-inventory-${GITHUB_SHA}.md"
          cp "$report" "$inventory_path"
          echo "$summary"
      - name: Upload exact-head RPC/function inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-rpc-function-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/public-rpc-function-inventory-${{ github.sha }}.md
          if-no-files-found: error
          retention-days: 14
      # The acceptance script only queries TEST_DATABASE_URL. Its Supabase URL input is checked by the loopback-only guard and is not contacted.
      - name: Verify cash-expense source journal and post/void concurrency on PostgreSQL 17
        env:
          E2E_MANAGER_EMAIL: admin@aghbari.ye
          E2E_EMAIL: ci-customer-one@example.test
          E2E_SUPABASE_URL: http://127.0.0.1:54321
        run: node scripts/test-cash-expense-journal-posting.mjs
      - name: Verify generic journal reversal idempotency and original uniqueness on PostgreSQL 17
        env:
          E2E_MANAGER_EMAIL: admin@aghbari.ye
          E2E_EMAIL: ci-customer-one@example.test
        run: node scripts/test-general-journal-reversal-concurrency.mjs
      - name: Verify purchase receipt source-cost and balanced accounting on PostgreSQL 17
        env:
          E2E_MANAGER_EMAIL: admin@aghbari.ye
          E2E_EMAIL: ci-customer-one@example.test
          E2E_SUPABASE_URL: http://127.0.0.1:54321
        run: node scripts/test-purchase-receipt-accounting.mjs
      - name: Verify concurrent customer and company invitation acceptance on PostgreSQL 17
        run: node scripts/test-invitation-acceptance-concurrency.mjs
      - name: Verify customer address default concurrency and tenant ownership on PostgreSQL 17
        run: node scripts/test-customer-address-concurrency.mjs
      - name: Verify tenant-scoped executive analytics on PostgreSQL 17
        run: node scripts/test-store-executive-analytics.mjs
      - name: Verify explicit customer quote decision under PostgreSQL 17
        run: node scripts/test-customer-quote-response-decision.mjs
      - name: Verify company invitation expiry persists and is audited under PostgreSQL 17
        run: node scripts/test-company-invitation-expiry.mjs
      - name: Verify exactly-once tenant-scoped stock-count start audit under PostgreSQL 17
        run: node scripts/test-stock-count-start-audit.mjs
      - name: Verify tenant-scoped asynchronous export lifecycle under PostgreSQL 17
        run: node scripts/test-async-export-jobs.mjs
      - name: Verify target-native import request idempotency under PostgreSQL concurrency
        run: node scripts/test-import-job-idempotency.mjs
      - name: Verify inventory import snapshot contract without implicit stock mutation
        run: node scripts/test-import-inventory-snapshot-contract.mjs
      - name: Verify tenant-safe persistent storefront favourites under PostgreSQL 17
        run: node scripts/test-storefront-saved-products.mjs
      - name: Verify isolated PostgreSQL 17 backup and restore
        env:
          PGTOOLS_DOCKER: "true"
        run: node scripts/test-local-backup-restore.mjs

      # The repository-wide Prettier rule currently reports thousands of pre-existing formatting errors.
      # Keep ESLint correctness rules enabled here and do not let that legacy formatting backlog hide build results.
      - name: Lint (excluding repository-wide Prettier formatting rule)
        run: npm run lint -- --rule=prettier/prettier:off
      - name: Build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

      # The dev server compiles routes on demand and can hide missing production SSR/handler output.
      # Verify the actual built artifact separately before treating a green build as deployable.
      - name: Production build preview smoke test on port 4173
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          npx wrangler dev --config .output/server/wrangler.json --compatibility-date 2026-10-30 --local --ip 127.0.0.1 --port 4173 > /tmp/aghbari-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          if [ ! -f .output/server/index.mjs ] || [ ! -f .output/server/wrangler.json ] || [ ! -f .output/public/manifest.webmanifest ]; then
            echo "Expected Nitro/Cloudflare production artifacts are missing after build."
            find .output -maxdepth 3 -type f | sort | head -n 200
            exit 1
          fi
          ready=0
          for attempt in $(seq 1 45); do
            status=$(curl --silent --connect-timeout 2 --max-time 5 --output /tmp/aghbari-preview-home.html --write-out "%{http_code}" http://127.0.0.1:4173/ || true)
            if [ "$status" = "200" ] && grep -q "الأغبري" /tmp/aghbari-preview-home.html; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/aghbari-preview.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Production preview did not serve the built Arabic storefront at HTTP 200."
            echo "Local CI preview uses the latest compatibility date supported by its bundled workerd binary (2026-10-30); built application compatibility metadata is unchanged and this is not production-runtime evidence."
            cat /tmp/aghbari-preview.log
            exit 1
          fi
          for route in \
            /login /register /forgot-password /cart /checkout /orders /register /forgot-password /invoices /statement /quotes /assistant \
            /store /catalog /collections /offers /categories /search /search/advanced /category/ci-missing--not-found /category/ci-missing--not-found/subcategory/ci-child--not-found /products /invite/ci-token /admin /admin/orders /admin/products /admin/audit /admin/stock-count /admin/inventory-transfers /admin/purchase-orders /admin/finance /admin/data /manifest.webmanifest /sw.js; do
            status=$(curl --silent --connect-timeout 2 --max-time 5 --output /tmp/aghbari-preview-route.html --write-out "%{http_code}" "http://127.0.0.1:4173$route" || true)
            if [ "$status" != "200" ]; then
              echo "Production preview expected HTTP 200 from $route, received $status"
              cat /tmp/aghbari-preview.log
              exit 1
            fi
          done
          # A generic not-found shell can still return HTTP 200. Require each critical
          # customer route to render its own title in the built production artifact.
          for route_spec in \
            "/invoices|الفواتير" \
            "/statement|كشف الحساب" \
            "/register|إنشاء حساب تجاري" \
            "/forgot-password|استعادة كلمة المرور" \
            "/admin/audit|سجل التدقيق" \
            "/admin/inventory-transfers|سجل تحويلات المخزون" \
            "/admin/purchase-orders|أوامر الشراء | متجر الأغبري" \
            "/store|المتجر" \
            "/catalog|الكتالوج" \
            "/collections|التصنيفات" \
            "/offers|العروض" \
            "/categories|تصنيفات المنتجات" \
            "/search|البحث" \
            "/search/advanced|البحث المتقدم" \
            "/category/ci-missing--not-found|التصنيف" \
            "/category/ci-missing--not-found/subcategory/ci-child--not-found|التصنيف الفرعي" \
            "/products|متجر الأغبري" \
            "/invite/ci-token|قبول دعوة الشركة"; do
            route="${route_spec%%|*}"
            expected_title="${route_spec#*|}"
            curl --fail --silent --show-error "http://127.0.0.1:4173$route" -o /tmp/aghbari-preview-route-contract.html
            if ! grep -Fq "$expected_title" /tmp/aghbari-preview-route-contract.html; then
              echo "Production preview route contract failed: $route did not render its own title '$expected_title'."
              cat /tmp/aghbari-preview-route-contract.html
              cat /tmp/aghbari-preview.log
              exit 1
            fi
          done
          # Verify the served static assets are the PWA files, not fallback HTML.
          curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:4173/sw.js -o /tmp/aghbari-preview-sw.js
          grep -Fq "CACHE_NAME" /tmp/aghbari-preview-sw.js || {
            echo "Production preview /sw.js did not contain the service worker implementation."
            cat /tmp/aghbari-preview-sw.js
            exit 1
          }
          for route in \
            /api/statement-pdf \
            /api/invoice-pdf/11111111-1111-4111-8111-111111111111; do
            status=$(curl --silent --connect-timeout 2 --max-time 5 --output /tmp/aghbari-preview-pdf-auth.json --write-out "%{http_code}" "http://127.0.0.1:4173$route" || true)
            if [ "$status" != "401" ]; then
              echo "Production preview expected unauthenticated PDF route $route to return 401, received $status"
              cat /tmp/aghbari-preview-pdf-auth.json
              cat /tmp/aghbari-preview.log
              exit 1
            fi
          done
          curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:4173/manifest.webmanifest -o /tmp/aghbari-preview-manifest.json
          grep -q "Aghbari Commerce" /tmp/aghbari-preview-manifest.json || {
            echo "Production preview PWA manifest is missing the canonical product identity."
            cat /tmp/aghbari-preview-manifest.json
            exit 1
          }

      - name: Dev server smoke test on port 5173
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/aghbari-vite-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ -o /tmp/aghbari-home.html; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/aghbari-vite-dev.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/aghbari-vite-dev.log
            exit 1
          fi
          grep -q "الأغبري" /tmp/aghbari-home.html || {
            echo "Arabic Aghbari product identity was not present in the dev-server response."
            cat /tmp/aghbari-vite-dev.log
            exit 1
          }
          # Probe the client and admin workspaces plus PWA assets. Route-unit tests alone
          # don't prove the dev server can serve each URL.
          for route in \
            /cart /checkout /compare /wishlist /addresses /company/contacts /company/members /company/accept-invitation /product/ci-route-smoke-test \
            /orders /register /forgot-password /invoices /statement /quotes /reorder /assistant /barcode /offline \
            /admin /admin/orders /admin/products /admin/customers /admin/pricing /admin/stock-count /admin/inventory-transfers /admin/purchase-orders /admin/data \
            /store /catalog /collections /offers /categories /search /search/advanced /category/ci-missing--not-found /category/ci-missing--not-found/subcategory/ci-child--not-found \
            /admin/operations /admin/finance /admin/reports /admin/settings \
            /manifest.webmanifest /sw.js; do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" "http://127.0.0.1:5173$route")
            if [ "$status" != "200" ]; then
              echo "Expected HTTP 200 from $route, received $status"
              cat /tmp/aghbari-vite-dev.log
              exit 1
            fi
          done
          # A 200 alone can be a generic SPA fallback or not-found shell. Assert route-specific
          # SSR document metadata so a missing file-based route cannot silently pass this probe.
          for route_spec in \
            "/invoices|الفواتير" \
            "/statement|كشف الحساب" \
            "/register|إنشاء حساب تجاري" \
            "/forgot-password|استعادة كلمة المرور" \
            "/admin/audit|سجل التدقيق" \
            "/admin/inventory-transfers|سجل تحويلات المخزون" \
            "/admin/purchase-orders|أوامر الشراء | متجر الأغبري" \
            "/categories|تصنيفات المنتجات" \
            "/search|البحث" \
            "/search/advanced|البحث المتقدم" \
            "/category/ci-missing--not-found|التصنيف" \
            "/category/ci-missing--not-found/subcategory/ci-child--not-found|التصنيف الفرعي"; do
            route="${route_spec%%|*}"
            expected_title="${route_spec#*|}"
            curl --fail --silent --show-error "http://127.0.0.1:5173$route" -o /tmp/aghbari-route-contract.html
            if ! grep -Fq "$expected_title" /tmp/aghbari-route-contract.html; then
              echo "Expected route-specific Arabic title '$expected_title' for $route, but the document did not contain it."
              cat /tmp/aghbari-route-contract.html
              cat /tmp/aghbari-vite-dev.log
              exit 1
            fi
          done
          # PDF endpoints must exist but refuse unauthenticated access before looking up finance data.
          for route in \
            /api/statement-pdf \
            /api/invoice-pdf/11111111-1111-4111-8111-111111111111; do
            status=$(curl --silent --output /tmp/aghbari-pdf-auth.json --write-out "%{http_code}" "http://127.0.0.1:5173$route")
            if [ "$status" != "401" ]; then
              echo "Expected unauthenticated PDF route $route to return 401, received $status"
              cat /tmp/aghbari-pdf-auth.json
              cat /tmp/aghbari-vite-dev.log
              exit 1
            fi
          done
          curl --fail --silent --show-error http://127.0.0.1:5173/manifest.webmanifest -o /tmp/aghbari-manifest.json
          grep -q "Aghbari Commerce" /tmp/aghbari-manifest.json || {
            echo "PWA manifest is missing the canonical Aghbari Commerce identity."
            cat /tmp/aghbari-manifest.json
            exit 1
          }
      - name: Browser price visibility acceptance (Chromium; local fixture; no backend writes)
        timeout-minutes: 18
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw-price-policy"
          npm install --prefix "$RUNNER_TEMP/pw-price-policy" --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.63.0
          mkdir -p node_modules/@playwright
          ln -s "$RUNNER_TEMP/pw-price-policy/node_modules/@playwright/test" node_modules/@playwright/test
          "$RUNNER_TEMP/pw-price-policy/node_modules/.bin/playwright" install chromium

          browser_dir="$HOME/.cache/ms-playwright"
          browser_bins="$(find "$browser_dir" -type f \( -name chrome -o -name chrome-headless-shell \) -perm -111 -print)"
          if [ -z "$browser_bins" ]; then
            echo "::error title=Chromium install failed::No executable Chromium browser was found in $browser_dir."
            exit 1
          fi
          missing=""
          while IFS= read -r browser; do
            [ -n "$browser" ] || continue
            ldd_output="$RUNNER_TEMP/price-policy-ldd-$(basename "$browser").txt"
            if ! ldd "$browser" > "$ldd_output" 2>&1; then
              missing="${missing}${browser}: ldd failed; "
              continue
            fi
            unresolved="$(awk '/not found/ { print $1 }' "$ldd_output" | paste -sd ',' -)"
            if [ -n "$unresolved" ]; then
              missing="${missing}${browser}: ${unresolved}; "
            fi
          done <<< "$browser_bins"
          if [ -n "$missing" ]; then
            echo "::warning title=Chromium system libraries missing::Installing OS packages only because ldd found unresolved libraries."
            printf '%s\n' "$missing"
            timeout 8m "$RUNNER_TEMP/pw-price-policy/node_modules/.bin/playwright" install-deps chromium
          else
            echo "All linked system libraries for Chromium are present; skipped redundant apt package installation."
          fi

          VITE_SUPABASE_URL=https://ci-placeholder.supabase.co \
          VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder \
          npm run dev -- --host 127.0.0.1 --port 5191 > /tmp/aghbari-price-policy-vite.log 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -P "$server_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:5191/e2e/fixtures/storefront-price-visibility.html -o /tmp/aghbari-price-policy-fixture.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Vite did not serve the isolated price-policy fixture."
            cat /tmp/aghbari-price-policy-vite.log
            exit 1
          fi

          E2E_BASE_URL=http://127.0.0.1:5191 "$RUNNER_TEMP/pw-price-policy/node_modules/.bin/playwright" test --config=playwright.config.ts --reporter=list e2e/storefront-price-visibility.spec.ts

