name: P1 Secret Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: Gitleaks full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout all available Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install checksum-verified Gitleaks CLI 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          work_dir="$RUNNER_TEMP/gitleaks-${version}"
          mkdir -p "$work_dir"

          curl --fail --silent --show-error --location "$release_url/$archive" --output "$work_dir/$archive"
          curl --fail --silent --show-error --location "$release_url/gitleaks_${version}_checksums.txt" --output "$work_dir/checksums.txt"

          awk -v asset="$archive" '$2 == asset || $2 == "*" asset { print }' "$work_dir/checksums.txt" > "$work_dir/selected-checksum.txt"
          test "$(wc -l < "$work_dir/selected-checksum.txt" | tr -d ' ')" = "1"
          (cd "$work_dir" && sha256sum --check selected-checksum.txt)

          tar -xzf "$work_dir/$archive" -C "$work_dir" gitleaks
          chmod 0755 "$work_dir/gitleaks"
          echo "$work_dir" >> "$GITHUB_PATH"

          "$work_dir/gitleaks" version
          "$work_dir/gitleaks" git --help > "$work_dir/git-help.txt" 2>&1
          grep -q -- '--log-opts' "$work_dir/git-help.txt"
          echo "Gitleaks git subcommand and --log-opts are available in v${version}." >> "$GITHUB_STEP_SUMMARY"

      - name: Prove historical deleted-secret detection with isolated Canary
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_BIN="$(command -v gitleaks)" bash scripts/test-gitleaks-history-canary.sh

      - name: Scan every available branch and tag history (redacted)
        id: history_scan
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set -euo pipefail

          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::Checkout is shallow; refusing to claim a complete history scan."
            exit 1
          fi

          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git update-ref refs/scan/workflow-head "$(git rev-parse HEAD)"

          available_commits="$(git rev-list --all --count)"
          remote_branch_refs="$(git for-each-ref --format='%(refname)' refs/remotes/origin/ | wc -l | tr -d ' ')"
          tag_refs="$(git for-each-ref --format='%(refname)' refs/tags/ | wc -l | tr -d ' ')"
          if [ "$available_commits" -lt 1 ] || [ "$remote_branch_refs" -lt 1 ]; then
            echo "::error::No complete remote branch history is available to scan."
            exit 1
          fi

          version="$(gitleaks version)"
          scan_sha="$(git rev-parse HEAD)"
          history_options="--full-history --all --diff-filter=tuxdb"
          evidence_dir="$RUNNER_TEMP/gitleaks-evidence"
          report_path="$evidence_dir/gitleaks-history-redacted.json"
          log_path="$RUNNER_TEMP/gitleaks-history.log"
          mkdir -p "$evidence_dir"

          printf 'Gitleaks version: %s\n' "$version"
          printf 'Scan SHA: %s\n' "$scan_sha"
          printf 'Shallow repository: false\n'
          printf 'Available commits across all refs: %s\n' "$available_commits"
          printf 'Remote branch refs: %s\n' "$remote_branch_refs"
          printf 'Tag refs: %s\n' "$tag_refs"
          printf 'Git log scope: %s\n' "$history_options"

          set +e
          gitleaks git \
            --redact \
            --exit-code=2 \
            --report-format=json \
            --report-path="$report_path" \
            --log-level=info \
            --log-opts="$history_options" \
            . 2>&1 | tee "$log_path"
          scanner_status=${PIPESTATUS[0]}
          set -e

          scanned_commits="$(grep -Eo '[0-9]+ commits scanned\.' "$log_path" | tail -n 1 | awk '{print $1}' || true)"
          if [ -z "$scanned_commits" ]; then
            echo "::error::Gitleaks did not emit a parseable commit-scan count."
            exit 1
          fi
          if [ ! -s "$report_path" ]; then
            echo "::error::The redacted Gitleaks report was not generated."
            exit 1
          fi

          {
            echo "## P1 Gitleaks history evidence"
            echo
            echo "- Scan SHA: $scan_sha"
            echo "- Version: $version"
            echo "- Shallow clone: false"
            echo "- Available commits across refs: $available_commits"
            echo "- Commits scanned by Gitleaks: $scanned_commits"
            echo "- Remote branch refs: $remote_branch_refs"
            echo "- Tags: $tag_refs"
            echo "- Explicit git log scope: $history_options"
            echo "- Canary: PASS — historical synthetic credential found after deletion; output redacted"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            printf 'scan_sha=%s\n' "$scan_sha"
            printf 'gitleaks_version=%s\n' "$version"
            printf 'shallow_repository=false\n'
            printf 'available_commits=%s\n' "$available_commits"
            printf 'commits_scanned=%s\n' "$scanned_commits"
            printf 'remote_branch_refs=%s\n' "$remote_branch_refs"
            printf 'tag_refs=%s\n' "$tag_refs"
            printf 'git_log_scope=%s\n' "$history_options"
            printf 'canary=PASS\n'
          } > "$evidence_dir/scan-metadata.txt"

          if [ "$scanner_status" -eq 0 ]; then
            echo "No leaks found in all fetched branch/tag history."
          elif [ "$scanner_status" -eq 2 ]; then
            echo "::error::Gitleaks detected one or more findings. Inspect only the redacted report artifact."
            exit 2
          else
            echo "::error::Gitleaks scanner failed with exit code $scanner_status."
            exit 1
          fi

      - name: Upload redacted historical scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-history-${{ github.sha }}
          path: ${{ runner.temp }}/gitleaks-evidence/
          if-no-files-found: warn
          retention-days: 14
