name: Import finalizer tenant scope PostgreSQL 17

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261024160000_finalize_import_job_single_arg_scope.sql"
      - "scripts/test-import-finalizer-tenant-scope.mjs"
      - ".github/workflows/import-finalizer-tenant-scope-pg17.yml"
      - "supabase/migrations/**"
      - "bun.lock"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261024160000_finalize_import_job_single_arg_scope.sql"
      - "scripts/test-import-finalizer-tenant-scope.mjs"
      - ".github/workflows/import-finalizer-tenant-scope-pg17.yml"
      - "supabase/migrations/**"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-finalizer-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aghbari_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aghbari_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aghbari_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Bun for frozen-lockfile verification
        uses: oven-sh/setup-bun@v2
      - name: Verify frozen dependency lockfile
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org --dry-run
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies from the verified lockfile
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Apply migrations and run baseline PostgreSQL acceptance
        run: npm run test:db
      - name: Prove legacy import finalizer is tenant scoped
        run: node scripts/test-import-finalizer-tenant-scope.mjs
