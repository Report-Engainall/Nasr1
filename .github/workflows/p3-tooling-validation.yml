name: P3 tooling validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/reconcile-bolt-recovery-archives.py"
      - ".github/workflows/p3-tooling-validation.yml"

permissions:
  contents: read

concurrency:
  group: p3-tooling-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  python-tooling:
    name: Python syntax and archive reconciliation self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the archive reconciliation utility
        run: python -m py_compile scripts/reconcile-bolt-recovery-archives.py
      - name: Run archive reconciliation self-tests
        run: python scripts/reconcile-bolt-recovery-archives.py --self-test
